# CI (Integración Continua)
#
# En cada push y en cada Pull Request, GitHub levanta una máquina virtual y:
#   - frontend: instala dependencias, corre los tests (Vitest) y compila (vite build)
#   - backend:  instala dependencias y corre los tests (node --test)
# Si algo falla, el commit queda marcado con una ❌ roja en GitHub.
#
# No necesita secrets: los tests no usan la base de datos.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite reutilizar este workflow desde deploy.yml
  workflow_call:

jobs:
  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios
        run: npm test

      - name: Build de producción
        run: npm run build

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios
        run: npm test
